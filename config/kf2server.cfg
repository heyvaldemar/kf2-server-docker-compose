##################################
####### Instance Settings ########
##################################
# LinuxGSM instance config for kf2server. Sourced by LinuxGSM at start.
#
# WRITTEN HERE AND NOT IN _default.cfg, which LinuxGSM overwrites on every
# update - the file says so at the top and it means it. This file is mounted
# from the repository, so git records every change to it.

# CO-OP, NOT VERSUS. LinuxGSM ships KFGameInfo_VersusSurvival, which is the
# player-versus-player mode: one side plays the zeds. Survival is the wave mode
# where everyone is on the same side, which is what a server for a group of
# friends is for.
gamemode="KFGameContent.KFGameInfo_Survival"
defaultmap="KF-BioticsLab"

# Difficulty and length live in their own variables so a script can change
# them without rewriting the start line - and so that a change made during a
# game is still there after the next restart. Setting them only in the running
# server was the first version of this, and it reverted silently.
#   difficulty 0 Normal, 1 Hard, 2 Suicidal, 3 Hell on Earth
#   length     0 four waves, 1 seven, 2 ten
kf2_difficulty="0"
kf2_length="1"

# SIX IS THE ENGINE'S NUMBER, NOT A CHOICE. Eight was tried and refused three
# different ways: as a URL option the server launched with MaxPlayers=8 and
# answered 6 to A2S; written into [KFGameContent.KFGameInfo_Survival] the
# server rewrote the ini back to 6 twenty-four seconds after start; submitted
# through WebAdmin the form returned HTTP 200 and the field came back 6.
# KFGameInfo_Survival clamps to 6, and the 12 seen elsewhere in these files
# belongs to VersusSurvival, which is 6-on-6. More seats need a mutator, not a
# setting.
startparameters="\"${defaultmap}?Game=${gamemode}?Difficulty=${kf2_difficulty}?GameLength=${kf2_length}?MaxPlayers=6?ConfigSubDir=${selfname} -QueryPort=${queryport}\""

# THE QUERY PORT MUST BE THE SAME NUMBER INSIDE AND OUTSIDE. Steam records a
# server by the query port the server BINDS, not by the one a router publishes.
# Published under a different number, Steam's directory sends clients to a
# port where something else answers; the game connection on 7777 succeeds, the
# Steam handshake then fails against a different game, and the server logs
# "Add unverified connection" followed by "clean up connection by handshake
# timeout". Direct A2S works throughout, which is what makes it look like a
# client problem. This number and KF2_SERVER_QUERY_PORT in .env are the same
# number, or neither works.
queryport="27015"

# THE DIRECTORY KF2'S LINUX SERVER NEVER MAKES. The KF2 wiki lists it as a
# known Linux issue: the server does not create KFGame/Cache, which it uses
# when it loads a map, and it has to exist. On the server this template comes
# from it was missing while the game segfaulted on three map changes in four
# days, the third 45 minutes after a restart, and in the 75 hours after it was
# made, to 2026-10-25, the game did not crash once. A documented gap closed,
# not a proven cure.
#
# HERE, BECAUSE LINUXGSM SOURCES THIS FILE BEFORE EVERY COMMAND, as the game's
# own user: the one place that runs after an install or a reinstall and before
# every start, start included. ONLY ONCE KFGame EXISTS: the image decides
# whether to install by whether serverfiles is empty, and LinuxGSM can source
# this file before that decision, so a directory made here first would make
# a fresh volume skip its install. tests/e2e-start.sh proves both against the
# pinned image.
if [ -d "${serverfiles}/KFGame" ]; then
	mkdir -p "${serverfiles}/KFGame/Cache"
fi
