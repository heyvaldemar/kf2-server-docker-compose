[Engine.Engine]
NetworkDevice=IpDrv.TcpNetDriver
ConsoleClassName=Engine.Console

[Engine.GameInfo]
MaxPlayers=6
bAdminCanPause=False
bKickLiveIdlers=True

[Engine.AccessControl]
IPPolicies=ACCEPT;*
AdminPassword=
GamePassword=
bAuthenticateClients=True
bAuthenticateServer=True
bAuthenticateListenHost=True
MaxAuthRetryCount=3
AuthRetryDelay=5

[KFGame.KFGameInfo]
GameLength=1
bDisableTeamCollision=False

[IpDrv.TcpNetDriver]
NetServerMaxTickRate=30
MaxClientRate=15000
