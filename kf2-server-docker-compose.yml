# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. Set KF2_SERVER_IMAGE_VERSION in .env to run a different tag while
# the digest for it is fetched normally, or KF2_SERVER_IMAGE_TAG to replace
# the whole reference. CI (the Trivy scan and check-pin-freshness) reads the
# pin from this line: this block is the single source of truth.
#
# ONE TAG PER GAME in this image: LinuxGSM publishes kf2, cs2, ark and a
# hundred others under the same name, so the tag IS the game and carries no
# version. The digest is the version; the image rebuilds weekly, the daily
# freshness job goes red when it does, and the pin moves deliberately.
x-images:
  kf2-server: &kf2-server-image ${KF2_SERVER_IMAGE_TAG:-gameservermanagers/gameserver:${KF2_SERVER_IMAGE_VERSION:-kf2@sha256:01586342139d66ba6c018f027636ab55ad331fa306b0339be461a2ac41338339}}

services:
  kf2-server:
    image: *kf2-server-image
    # Handles untrusted input from the internet and cannot gain privileges
    # through a setuid binary.
    security_opt:
      - no-new-privileges:true
    # Killing Floor 2 is heavier than a Source server: six players, Unreal
    # Engine 3, and LinuxGSM runs SteamCMD inside the same container on every
    # update. 4g on the machine this template comes from; raise it when a
    # report shows it near the ceiling rather than guessing high now.
    deploy:
      resources:
        limits:
          memory: ${KF2_SERVER_MEMORY_LIMIT:-4g}
          cpus: "${KF2_SERVER_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${KF2_SERVER_MEMORY_RESERVATION:-1g}
          cpus: "${KF2_SERVER_CPU_RESERVATION:-0.5}"
    ports:
      # THE QUERY PORT MUST CARRY THE SAME NUMBER INSIDE AND OUTSIDE. Steam
      # records a server by the port the server BINDS, not the one a router
      # publishes. A first version kept 27015 inside and published it as 27020
      # because another game held 27015 outside — and nobody could join: Steam's
      # directory pointed clients at 27015, where the other game answered. The
      # game connection reached 7777 correctly, the Steam handshake then failed
      # against a different game, and the server logged "Add unverified
      # connection" followed one second later by "clean up connection by
      # handshake timeout". Direct A2S worked throughout, which is exactly what
      # made it look like a client-side problem. Change the query port in
      # config/kf2server.cfg AND here, never in only one place.
      - "${KF2_SERVER_GAME_PORT:-7777}:${KF2_SERVER_GAME_PORT:-7777}/udp"
      - "${KF2_SERVER_QUERY_PORT:-27015}:${KF2_SERVER_QUERY_PORT:-27015}/udp"
      - "${KF2_SERVER_STEAM_PORT:-20560}:${KF2_SERVER_STEAM_PORT:-20560}/udp"
      # WEBADMIN, BOUND TO LOCALHOST. Killing Floor 2 has no rcon: this small
      # web application is the entire administrative interface, so publishing
      # it to the internet puts a login form guarding a reconfigurable game
      # server on the open internet. It answers on this host only unless
      # KF2_SERVER_WEBADMIN_BIND says otherwise — set that to a LAN address,
      # never to 0.0.0.0.
      #
      # AND ITS PASSWORD STAYS EMPTY. Both times an AdminPassword was set on
      # the machine this template comes from, the server advertised itself as
      # password protected and dropped every client that did not answer the
      # prompt. Nobody can log in to WebAdmin without one, so moderation does
      # not go through WebAdmin at all: tools/kf2-ban.sh works on the ini the
      # server rewrites, and the README says how.
      - "${KF2_SERVER_WEBADMIN_BIND:-127.0.0.1}:${KF2_SERVER_WEBADMIN_PORT:-8080}:8080/tcp"
    environment:
      # The image bakes GAMESERVER=kf2server, UID/GID 1000 and the /data layout;
      # named anyway so the contract is visible without docker inspect.
      GAMESERVER: kf2server
      UID: "${KF2_SERVER_UID:-1000}"
      GID: "${KF2_SERVER_GID:-1000}"
      TZ: ${KF2_SERVER_TIMEZONE:-UTC}
      # LINUXGSM'S OWN HOURLY UPDATE IS OFF, ON PURPOSE. The image's default
      # (60) makes its entrypoint install an hourly `kf2server update` cron
      # job, which restarts the server whoever is on. Under no-new-privileges,
      # above, it never installed at all: crontab is setgid, the hardening
      # ignores that bit, and the install fails with "mkstemp: Permission
      # denied" while the entrypoint carries on. Up to v1.2 this line offered
      # KF2_SERVER_UPDATE_CHECK=60 for it, and it did nothing. Off by accident
      # is one image change from on, so it is off here by decision, and
      # tools/kf2-refresh.sh is the update path: it restarts only an empty
      # server that is behind Steam's build (the game lives in the volume, so
      # the image can be current while the game is weeks behind, and Steam
      # turns every player away from a server on the old build).
      UPDATE_CHECK: "0"
      # NPM DOES NOT WAIT FOR ITS REGISTRY AT START. The image's entrypoint runs
      # `npm install` in /app/lgsm on every start, for the module LinuxGSM
      # queries game servers with. The module is already there, "up to date",
      # but npm still sends its audit request to the registry, and on the
      # server this template comes from, the night the registry did not answer,
      # npm waited its default five minutes with the game down and missing from
      # Steam's list. A start there took twenty minutes before these lines and
      # twenty-five seconds after. The audit request is the one that waits:
      # against a registry that never answers, audit off alone finished in a
      # second, and the update notice off alone was still waiting at sixty.
      # The rest bound LinuxGSM's own `npm update`, which does need the
      # registry: cached metadata first, thirty seconds and one retry.
      # tests/e2e-start.sh measures both against the pinned image.
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_PREFER_OFFLINE: "true"
      NPM_CONFIG_FETCH_TIMEOUT: "30000"
      NPM_CONFIG_FETCH_RETRIES: "1"
    volumes:
      # EVERYTHING LIVES HERE: server files, LinuxGSM's state, logs and saves.
      # The image carries none of it, so this volume IS the server — about
      # 25 GB that SteamCMD fetches on first start.
      - kf2-server-data:/data
      # THE SETTINGS LIVE OUTSIDE THE VOLUME, where git records their history
      # and a backup that skips 25 GB of replaceable game files still sees them.
      # LinuxGSM reads this file at start; the file it ships beside it,
      # _default.cfg, is overwritten on every update and says so at the top.
      - ./config/kf2server.cfg:/data/config-lgsm/kf2server/kf2server.cfg
    healthcheck:
      # THE GAME, NOT THE WRAPPER. A first version of this also accepted
      # `pgrep -f kf2server`, which matches LinuxGSM's own supervising script —
      # so the container reported HEALTHY while SteamCMD was still downloading
      # twenty-five gigabytes and no server existed at all. A check that passes
      # before the thing it checks exists is worse than none, because it is
      # believed. KFGameSteamServer.bin is the actual server binary.
      #
      # THE BRACKET IS LOAD-BEARING. Without it this check passed for every
      # pattern ever given to it — including one naming a process that does not
      # exist — because `pgrep -f` searches full command lines and the shell
      # running the check has the pattern in its own. Measured in this
      # container: `pgrep -f "ZZZ_no_such_process"` exits 0; with the first
      # letter in a character class it exits 1. A server crashed with a core
      # dump, two people were dropped mid-game, and this reported HEALTHY for
      # the whole of it. tests/e2e-healthcheck.sh proves the bracket against a
      # real container.
      test: ["CMD-SHELL", "pgrep -f '[K]FGameSteamServer.bin' >/dev/null"]
      # THE INTERVAL TIMES THE RETRIES IS THE FLOOR ON NOTICING A CRASH. At 60s
      # and three retries a dead server read healthy for three minutes, and a
      # watchdog polling every two minutes on top of that left a full server
      # unable to rejoin for four and a half. A missing process is not a signal
      # that needs debouncing, and pgrep reading /proc costs nothing, so the
      # floor is now thirty seconds; tests/e2e-healthcheck.sh measures it.
      interval: 10s
      timeout: 5s
      retries: 3
      # A FULL INSTALL, NOT A RESTART. An empty volume means SteamCMD fetches
      # the whole game; the first install took about ten minutes on a fast link
      # and a verify pass can take longer. Fifteen minutes was cutting it fine
      # enough to raise a false alarm.
      start_period: ${KF2_SERVER_START_PERIOD:-60m}
    # Unreal Engine writes its state on the way out; ten seconds and a SIGKILL
    # loses the map's progress and can leave LinuxGSM's own lock behind.
    stop_grace_period: ${KF2_SERVER_STOP_GRACE_PERIOD:-60s}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${KF2_SERVER_LOG_MAX_SIZE:-10m}
        max-file: "${KF2_SERVER_LOG_MAX_FILE:-3}"

# DECLARED EXTERNAL SO `docker compose down -v` CANNOT DELETE IT.
#
# Twenty-five gigabytes that SteamCMD downloaded once, plus the server's own
# state. As a project-managed volume it is one `down -v` away from being gone —
# and `down -v` is the command everybody reaches for when a stack misbehaves.
# Create it before the first start:  docker volume create kf2-server-data
volumes:
  kf2-server-data:
    name: kf2-server-data
    external: true
